name: Atualizar EPG

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Baixar EPG
        run: |
          echo "Baixando EPG..."
          curl -L -o epg.xml.gz https://epgshare01.online/epgshare01/epg_ripper_BG1.xml.gz
          ls -lh

      - name: Descompactar
        run: |
          echo "Descompactando..."
          gunzip -f epg.xml.gz || echo "Falhou ao descompactar"
          ls -lh

      - name: Verificar XML
        run: |
          echo "Procurando XML..."
          ls *.xml || echo "Nenhum XML encontrado"

      - name: Renomear
        run: |
          FILE=$(ls *.xml 2>/dev/null | head -n 1)
          if [ -z "$FILE" ]; then
            echo "ERRO: nenhum XML encontrado"
            exit 1
          fi
          mv "$FILE" epg.xml
          echo "Arquivo renomeado para epg.xml"

      - name: Commit e push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add epg.xml
          git commit -m "EPG atualizado automaticamente" || echo "Sem mudanças"
          git pushname: Atualizar EPG

