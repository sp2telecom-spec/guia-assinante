name: Atualizar EPG (Pro)

permissions:
  contents: write

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Baixar EPG
        run: |
          set -e
          URL="https://epgshare01.online/epgshare01/epg_ripper_BR1.xml.gz"

          for i in 1 2 3; do
            curl -L --fail -o epg.xml.gz "$URL" && break
            sleep 5
          done

      - name: Descompactar
        run: gunzip -f epg.xml.gz

      - name: Padronizar arquivo
        run: |
          FILE=$(ls *.xml | head -n 1)

          if [ "$FILE" != "epg.xml" ]; then
            mv "$FILE" epg.xml
          fi

      - name: Commit e push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add epg.xml

          if git diff --cached --quiet; then
            echo "Sem mudanças"
            exit 0
          fi

          git commit -m "EPG atualizado automaticamente"
          git push
