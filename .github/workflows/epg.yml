name: Atualizar EPG

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v3

      - name: Baixar EPG
        run: curl -L -o epg.xml.gz https://epgshare01.online/epgshare01/epg_ripper_BG1.xml.gz

      - name: Descompactar
        run: gunzip -f epg.xml.gz

      - name: Renomear
        run: mv epg_ripper_BG1.xml epg.xml

      - name: Commit e push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add epg.xml
          git commit -m "EPG atualizado automaticamente" || echo "Sem mudanças"
          git push
