name: Atualizar EPG

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-epg:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # 👈 ESSA LINHA RESOLVE

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4.2.2

      - name: Baixar EPG
        run: |
          curl -L -o epg.xml.gz https://epgshare01.online/epgshare01/epg_ripper_BR1.xml.gz

      - name: Descompactar
        run: |
          gunzip -f epg.xml.gz

      - name: Garantir nome epg.xml
        run: |
          FILE=$(ls *.xml | head -n 1)
          if [ "$FILE" != "epg.xml" ]; then
            mv "$FILE" epg.xml
          fi

      - name: Commit e push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add epg.xml
          git commit -m "EPG atualizado automaticamente" || echo "Sem mudanças"
          git push
