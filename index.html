<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>EPG TV</title>

<style>
body {
  margin: 0;
  background: #0b0b0f;
  font-family: Arial, sans-serif;
  color: #fff;
}

/* HEADER */
header {
  padding: 20px;
  font-size: 24px;
  font-weight: bold;
}

/* CARROSSEL */
#carousel {
  display: flex;
  overflow-x: auto;
  scroll-behavior: smooth;
  padding: 20px;
  gap: 15px;
}

/* CARD */
.channel {
  min-width: 260px;
  background: #14141c;
  border-radius: 12px;
  padding: 15px;
  transition: 0.3s;
  position: relative;
}

.channel:hover {
  transform: scale(1.08);
  background: #1f1f2a;
}

/* LOGO */
.logo {
  width: 100%;
  height: 80px;
  object-fit: contain;
  margin-bottom: 10px;
}

/* NUMERO */
.number {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 12px;
  opacity: 0.5;
}

/* TITULO */
.title {
  font-size: 16px;
  font-weight: bold;
}

/* PROGRAMA */
.program {
  font-size: 14px;
  opacity: 0.8;
}

/* BARRA */
.progress {
  margin-top: 10px;
  height: 5px;
  background: #333;
  border-radius: 5px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  background: #e50914;
  width: 0%;
}

/* AUTO SCROLL */
#carousel::-webkit-scrollbar {
  display: none;
}
</style>
</head>

<body>

<header>📺 Guia de Programação</header>

<div id="carousel"></div>

<script>
const EPG_URL = "dados_epg.xml";

/* LOGOS */
const logos = {
"JOVEM PAN2":"https://upload.wikimedia.org/wikipedia/commons/4/41/Logotipo_da_TV_Jovem_Pan_News.png",
"H&H HD":"https://upload.wikimedia.org/wikipedia/commons/9/90/Discovery_H%26H_Logo_2022.webp",
"TLC HD":"https://upload.wikimedia.org/wikipedia/commons/7/74/TLC_Logo.svg",
"ARTE 1":"https://upload.wikimedia.org/wikipedia/commons/3/31/Arte_1_logo.svg",
"BAND NEWS":"https://upload.wikimedia.org/wikipedia/commons/c/ce/BandNewsTV2024.svg",
"TV CAMARA":"https://upload.wikimedia.org/wikipedia/commons/8/8e/Marca_TV_C%C3%A2mara_-_2018.png",
"TV SENADO":"https://upload.wikimedia.org/wikipedia/commons/3/3f/TV_Senado_logo_%281996%E2%80%932016%29.png",
"TV ESCOLA":"https://upload.wikimedia.org/wikipedia/commons/b/b5/TV_Escola.png",
"CANAL SAUDE":"https://acervo.canalsaude.fiocruz.br/tools/images/logo-topMaior.jpg",
"BAND":"https://upload.wikimedia.org/wikipedia/commons/2/2b/Rede_Bandeirantes_logo_2018.svg",
"RECORD NEWS":"https://upload.wikimedia.org/wikipedia/commons/4/46/Record_News_logo_2023.svg",
"CNN BRASIL":"https://upload.wikimedia.org/wikipedia/commons/8/8b/CNN_Brasil_%28red_background%29.svg",
"CARTOON NETWORK":"https://upload.wikimedia.org/wikipedia/commons/8/80/Cartoon_Network_2010_logo.svg",
"DISCOVERY":"https://upload.wikimedia.org/wikipedia/commons/f/f1/2019_Discovery_logo.svg",
"WARNER HD":"https://upload.wikimedia.org/wikipedia/commons/b/b0/Warner_Channel_2026.svg",
"SONY HD":"https://upload.wikimedia.org/wikipedia/commons/e/ee/Sony_Channel_LA_2023.png",
"SPACE HD":"https://upload.wikimedia.org/wikipedia/commons/1/1a/SpaceLogo.svg",
"TNT HD":"https://upload.wikimedia.org/wikipedia/commons/2/24/TNT_Logo_2016.svg",
"HISTORY HD":"https://upload.wikimedia.org/wikipedia/commons/0/01/History_%282021%29.svg",
"AXN HD":"https://upload.wikimedia.org/wikipedia/commons/5/52/AXN_logo_%282015%29.svg",
"A&E HD":"https://upload.wikimedia.org/wikipedia/commons/d/df/A%26E_Network_logo.svg"
};

/* FORMATAR HORA */
function formatTime(t){
  return t.substring(8,10)+":"+t.substring(10,12);
}

/* CALCULAR PROGRESSO */
function calcProgress(start, stop){
  const now = new Date().getTime();
  const s = new Date(
    start.substring(0,4),
    start.substring(4,6)-1,
    start.substring(6,8),
    start.substring(8,10),
    start.substring(10,12)
  ).getTime();

  const e = new Date(
    stop.substring(0,4),
    stop.substring(4,6)-1,
    stop.substring(6,8),
    stop.substring(8,10),
    stop.substring(10,12)
  ).getTime();

  return Math.min(100, Math.max(0, ((now - s) / (e - s)) * 100));
}

/* LOAD EPG */
fetch(EPG_URL)
.then(r => r.text())
.then(str => new window.DOMParser().parseFromString(str,"text/xml"))
.then(data => {

  const progs = data.querySelectorAll("programme");
  const container = document.getElementById("carousel");

  let i = 1;

  progs.forEach(p => {

    const now = new Date().toISOString().replace(/[-:TZ]/g,"").slice(0,12);
    if (p.getAttribute("start") <= now && p.getAttribute("stop") >= now) {

      const title = p.querySelector("title")?.textContent || "Sem título";
      const channel = p.getAttribute("channel");

      const logo = logos[channel] || "https://via.placeholder.com/150x80?text=TV";

      const progress = calcProgress(p.getAttribute("start"), p.getAttribute("stop"));

      const card = `
      <div class="channel">
        <div class="number">${String(i).padStart(3,"0")}</div>
        <img class="logo" src="${logo}">
        <div class="title">${channel}</div>
        <div class="program">${title}</div>
        <div class="progress">
          <div class="progress-bar" style="width:${progress}%"></div>
        </div>
      </div>
      `;

      container.innerHTML += card;
      i++;
    }
  });

});

/* AUTO CARROSSEL */
setInterval(()=>{
  document.getElementById("carousel").scrollBy({
    left: 300,
    behavior: "smooth"
  });
}, 4000);

</script>

</body>
</html>
