<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Guia de Programação</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #0b1220;
    color: #fff;
}

header {
    background: #111b2e;
    padding: 10px;
    display: flex;
    justify-content: space-between;
}

#grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(3, 1fr);
    gap: 10px;
    padding: 10px;
    height: calc(100vh - 50px);
}

.card {
    background: #162235;
    padding: 10px;
    border-radius: 8px;
}

.channel {
    color: #00d4ff;
    font-weight: bold;
    margin-bottom: 6px;
}

.now {
    color: #00ff99;
    font-size: 13px;
}

.next {
    color: #aaa;
    font-size: 12px;
}
</style>
</head>

<body>

<header>
    <div>📺 EPG IPTV FIX</div>
    <div id="clock"></div>
</header>

<div id="grid"></div>

<script>

// ✔ EPG oficial
const epgUrl = "https://iptv-org.github.io/epg/guides/br.xml";

// seus canais
const channels = [
"JOVEM PAN2","H&H HD","TLC HD","ARTE 1","BAND NEWS",
"TV CAMARA","TV SENADO","TV ESCOLA","CANAL SAUDE","BAND",
"RECORD NEWS","CNN BRASIL","CNN INTERNACIONAL","CNN ESPANHOL",
"ESPN HD","ESPN 2","ESPN 3","ESPN 4","ESPN 5","ESPN 6 (ESPN EXTRA HD)"
];

let epgMap = {};

// relógio
setInterval(()=>{
    document.getElementById("clock").innerText =
    new Date().toLocaleTimeString("pt-BR");
},1000);

// normaliza nomes
function norm(name){
    return name
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/\s/g,"");
}

// converte horário XMLTV
function parseTime(t){
    if(!t) return new Date();
    return new Date(
        t.substr(0,4)+"-"+
        t.substr(4,2)+"-"+
        t.substr(6,2)+"T"+
        t.substr(8,2)+":"+
        t.substr(10,2)+":00"
    );
}

// ======================
// CARREGA EPG
// ======================
async function loadEPG(){

    const res = await fetch(epgUrl);
    const xmlText = await res.text();

    const xml = new DOMParser().parseFromString(xmlText,"text/xml");
    const items = xml.getElementsByTagName("programme");

    epgMap = {};

    for(let i=0;i<items.length;i++){

        let ch = items[i].getAttribute("channel");
        let title = items[i].getElementsByTagName("title")[0]?.textContent || "";
        let start = parseTime(items[i].getAttribute("start"));

        if(!epgMap[ch]) epgMap[ch] = [];

        epgMap[ch].push({title,start});
    }

    render();
}

// ======================
// MATCH SIMPLES
// ======================
function findProgram(channelName){

    let key = Object.keys(epgMap).find(k =>
        norm(k).includes(norm(channelName))
    );

    if(!key) return ["Sem info",""];

    let list = epgMap[key];

    let now = list[0]?.title || "Sem info";
    let next = list[1]?.title || "";

    return [now,next];
}

// ======================
// RENDER
// ======================
function render(){

    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    channels.slice(0,6).forEach(ch=>{

        const [now,next] = findProgram(ch);

        const div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <div class="channel">${ch}</div>
            <div class="now">AGORA: ${now}</div>
            <div class="next">PRÓXIMO: ${next}</div>
        `;

        grid.appendChild(div);
    });
}

// init
loadEPG();
setInterval(loadEPG,300000);

</script>

</body>
</html>
