<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>EPG TV</title>

<style>

/* ===== TELA 16:9 FIXA (PADRÃO OBS) ===== */
html, body{
  width:1920px;
  height:1080px;
  margin:0;
  padding:0;
  overflow:hidden;
  background:#0b0b0f;
  font-family:Arial, sans-serif;
  color:#fff;
}

/* CENTRALIZA */
body{
  display:flex;
  flex-direction:column;
}

/* HEADER */
header{
  padding:25px 40px;
  font-size:32px;
  font-weight:bold;
}

/* CARROSSEL */
#carousel{
  display:flex;
  gap:20px;
  padding:20px 40px;
  transition:transform .6s ease;
}

/* CARD */
.channel{
  min-width:300px;
  height:280px;
  background:#14141c;
  border-radius:14px;
  padding:15px;
  box-shadow:0 0 20px rgba(0,0,0,0.4);
}

/* LOGO */
.logo{
  width:100%;
  height:90px;
  object-fit:contain;
}

/* TEXTOS */
.title{
  font-size:18px;
  font-weight:bold;
  margin-top:10px;
}

.program{
  font-size:15px;
  margin-top:8px;
}

.next{
  font-size:13px;
  opacity:.7;
  margin-top:10px;
}

/* BARRA */
.progress{
  height:6px;
  background:#333;
  margin-top:12px;
  border-radius:10px;
  overflow:hidden;
}

.bar{
  height:100%;
  background:#e50914;
}

/* ANIMAÇÃO LEVE */
.channel:hover{
  transform:scale(1.05);
  transition:.3s;
}

</style>
</head>

<body>

<header>📺 Guia de Programação</header>
<div id="carousel"></div>

<script>

/* ===== CONFIG ===== */
const EPG_URL = "dados_epg.xml";

/* CANAIS (EDITE AQUI COM SEUS LOGOS) */
const canais = [
{num:"001", nome:"JOVEM PAN", id:"JovemPan.br", logo:"https://images.weserv.nl/?url=upload.wikimedia.org/wikipedia/commons/4/41/Logotipo_da_TV_Jovem_Pan_News.png"},
{num:"002", nome:"RECORD NEWS", id:"Record.News.br", logo:"https://images.weserv.nl/?url=upload.wikimedia.org/wikipedia/commons/4/46/Record_News_logo_2023.svg"},
{num:"003", nome:"ESPN", id:"ESPN.br", logo:"https://images.weserv.nl/?url=upload.wikimedia.org/wikipedia/commons/2/2f/ESPN_wordmark.svg"},
{num:"004", nome:"CARTOON", id:"Cartoon.Network.br", logo:"https://images.weserv.nl/?url=upload.wikimedia.org/wikipedia/commons/8/80/Cartoon_Network_2010_logo.svg"},
{num:"005", nome:"TNT", id:"TNT.br", logo:"https://images.weserv.nl/?url=upload.wikimedia.org/wikipedia/commons/2/24/TNT_Logo_2016.svg"}
];

/* ===== FUNÇÕES ===== */
function parseDate(t){
  if(!t) return 0;
  return new Date(
    t.substring(0,4),
    t.substring(4,6)-1,
    t.substring(6,8),
    t.substring(8,10),
    t.substring(10,12)
  ).getTime();
}

function calc(start,stop){
  const now = Date.now();
  const s = parseDate(start);
  const e = parseDate(stop);
  if(!s || !e) return 0;
  return Math.max(0, Math.min(100, ((now-s)/(e-s))*100));
}

function hora(t){
  if(!t) return "--:--";
  return t.substring(8,10)+":"+t.substring(10,12);
}

/* ===== LOAD EPG ===== */
fetch(EPG_URL)
.then(r=>r.text())
.then(str=>new DOMParser().parseFromString(str,"text/xml"))
.then(xml=>{

const progs = [...xml.querySelectorAll("programme")];
const box = document.getElementById("carousel");

canais.forEach(c=>{

try{

let now = new Date().toISOString().replace(/[-:TZ]/g,"").slice(0,12);

/* ATUAL */
let atual = progs.find(p =>
p.getAttribute("channel")==c.id &&
p.getAttribute("start")<=now &&
p.getAttribute("stop")>=now
);

/* PRÓXIMO */
let prox = progs.find(p =>
p.getAttribute("channel")==c.id &&
p.getAttribute("start") > now
);

/* DADOS */
let titulo = atual?.querySelector("title")?.textContent || "Sem programação";
let inicio = hora(atual?.getAttribute("start"));
let fim = hora(atual?.getAttribute("stop"));

let proxTitulo = prox?.querySelector("title")?.textContent || "Sem info";
let proxHora = hora(prox?.getAttribute("start"));

let prog = atual ? calc(atual.getAttribute("start"),atual.getAttribute("stop")) : 0;

/* HTML */
box.innerHTML += `
<div class="channel">
<img class="logo" src="${c.logo}" onerror="this.style.display='none'">

<div class="title">${c.num} - ${c.nome}</div>

<div class="program">
<b>${inicio} - ${fim}</b><br>
${titulo}
</div>

<div class="progress">
<div class="bar" style="width:${prog}%"></div>
</div>

<div class="next">
➡ ${proxHora} - ${proxTitulo}
</div>

</div>
`;

}catch(e){
console.log("Erro canal:",c.nome,e);
}

});

/* ===== CARROSSEL INFINITO ===== */
let index = 0;
const total = canais.length;

setInterval(()=>{
  index++;
  if(index >= total) index = 0;
  box.style.transform = `translateX(-${index * 320}px)`;
},4000);

})
.catch(err=>{
  document.body.innerHTML = "<h2 style='padding:20px'>Erro ao carregar EPG</h2>";
  console.error(err);
});

</script>

</body>
</html>
