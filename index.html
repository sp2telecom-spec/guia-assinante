  const progs = xml.querySelectorAll("programme");

      p.getAttribute("channel") === c.id &&
      p.getAttribute("start") <= now &&
      p.getAttribute("stop") >= now
    );

    const titulo = atual?.querySelector("title")?.textContent || "Sem programação";

    const card = `
    <div class="channel">
      <img class="logo" src="${logos[c.nome] || 'https://via.placeholder.com/150x80?text=TV'}">

      <div class="program">${titulo}</div>
    </div>
    `;
