<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>EPG PREMIUM</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:#fff;
  overflow:hidden;
}

header {
  background:#111b2e;
  padding:12px;
  display:flex;
  justify-content:space-between;
}

#grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:repeat(3,1fr);
  gap:12px;
  padding:12px;
  height:calc(100vh - 60px);
}

.card {
  background:linear-gradient(145deg,#162235,#0f172a);
  padding:12px;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  box-shadow:0 0 20px rgba(0,0,0,0.6);
  opacity:0;
  transform:translateY(20px);
  animation:fadeIn 0.6s forwards;
}

@keyframes fadeIn {
  to {
    opacity:1;
    transform:translateY(0);
  }
}

.top {
  display:flex;
  align-items:center;
  gap:10px;
}

.logo {
  width:50px;
  height:50px;
  object-fit:contain;
}

.number {
  font-size:14px;
  color:#888;
}

.channel {
  font-size:16px;
  font-weight:bold;
  color:#00d4ff;
}

.now {
  font-size:14px;
  color:#00ff99;
}

.next {
  font-size:12px;
  color:#aaa;
}

/* barra */
.progress {
  height:6px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
  margin-top:6px;
}

.bar {
  height:100%;
  background:linear-gradient(90deg,#00ff99,#00d4ff);
  width:0%;
  transition:width 1s linear;
}
</style>
</head>

<body>

<header>
<div>📺 GUIA PREMIUM</div>
<div id="clock"></div>
</header>

<div id="grid"></div>

<script>

const epgUrl = "./dados_epg.xml";

const channels = [
  { id:"ESPN.br", name:"ESPN HD" },
  { id:"ESPN.2.br", name:"ESPN 2" },
  { id:"Band.br", name:"BAND" },
  { id:"Band.News.br", name:"BAND NEWS" },
  { id:"CNN.International.br", name:"CNN BRASIL" },
  { id:"Record.News.br", name:"RECORD NEWS" },
  { id:"Cartoon.Network.br", name:"CARTOON NETWORK" },
  { id:"Discovery.Channel.br", name:"DISCOVERY CHANNEL" },
  { id:"TLC.br", name:"TLC HD" }
];

let epg = {};
let page = 0;

// relógio
setInterval(()=>{
document.getElementById("clock").innerText =
new Date().toLocaleTimeString("pt-BR");
},1000);

// logo automático
function getLogo(name){
let base = name.toLowerCase().replace(/\s/g,"");
return `https://logo.clearbit.com/${base}.com`;
}

// parse hora
function parseTime(t){
return new Date(
t.substring(0,4)+"-"+t.substring(4,6)+"-"+t.substring(6,8)+"T"+
t.substring(8,10)+":"+t.substring(10,12)+":"+t.substring(12,14)
).getTime();
}

// load epg
async function load(){

const res = await fetch(epgUrl);
const xml = new DOMParser().parseFromString(await res.text(),"text/xml");

const items = xml.getElementsByTagName("programme");

epg = {};

for(let i=0;i<items.length;i++){

let ch = items[i].getAttribute("channel");
let title = items[i].getElementsByTagName("title")[0]?.textContent || "";
let start = parseTime(items[i].getAttribute("start"));
let stop = parseTime(items[i].getAttribute("stop"));

if(!epg[ch]) epg[ch] = [];

epg[ch].push({title,start,stop});
}

render();
}

// agora
function getNow(id){
let list = epg[id];
if(!list) return null;

let now = Date.now();

for(let p of list){
if(now>=p.start && now<=p.stop){
let progress = ((now-p.start)/(p.stop-p.start))*100;
return {title:p.title,progress};
}
}
return null;
}

// próximo
function getNext(id){
let list = epg[id];
if(!list) return "";

let now = Date.now();

for(let p of list){
if(p.start>now) return p.title;
}
return "";
}

// render com paginação
function render(){

const grid = document.getElementById("grid");
grid.innerHTML = "";

let start = page * 6;
let slice = channels.slice(start,start+6);

slice.forEach((c,i)=>{

let now = getNow(c.id);
let next = getNext(c.id);

let number = String(start+i+1).padStart(3,"0");

const div = document.createElement("div");
div.className="card";

div.innerHTML=`
<div class="top">
  <img class="logo" src="${getLogo(c.name)}">
  <div>
    <div class="number">${number}</div>
    <div class="channel">${c.name}</div>
  </div>
</div>

<div class="now">AGORA: ${now?.title || "Sem info"}</div>

<div class="progress">
  <div class="bar" style="width:${now?.progress || 0}%"></div>
</div>

<div class="next">PRÓXIMO: ${next || "Sem info"}</div>
`;

grid.appendChild(div);

});

}

// carrossel automático
setInterval(()=>{
page++;
if(page*6 >= channels.length) page = 0;
render();
},10000);

// init
load();
setInterval(load,300000);

</script>

</body>
</html>
