<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<style>
html, body{
  width:1920px;
  height:1080px;
  margin:0;
  padding:0;
  overflow:hidden;
  background:transparent;
  font-family:Arial, sans-serif;
  color:#fff;
}

/* TOPO (hora + clima) */
header{
  position:absolute;
  top:20px;
  left:40px;
  font-size:34px;
  font-weight:bold;
}

/* CARROSSEL */
#carousel{
  display:flex;
  gap:20px;
  position:absolute;
  top:120px;
  left:40px;
  transition:transform .6s ease;
}

/* CARD CANAL */
.channel{
  min-width:300px;
  height:280px;
  background:rgba(20,20,28,0.85);
  border-radius:14px;
  padding:15px;
  box-shadow:0 0 15px rgba(0,0,0,0.4);
}

/* LOGO */
.logo{
  width:100%;
  height:45px;
  object-fit:contain;
}

/* TITULO */
.title{
  font-size:17px;
  font-weight:bold;
  margin-top:8px;
}

/* PROGRAMA ATUAL */
.program{
  font-size:14px;
  margin-top:6px;
}

/* PROXIMO */
.next{
  font-size:12px;
  opacity:.7;
  margin-top:8px;
}

/* BARRA */
.progress{
  height:6px;
  background:#333;
  margin-top:10px;
  border-radius:10px;
  overflow:hidden;
}

.bar{
  height:100%;
  background:#ff0000;
}
</style>
</head>

<body>

<header id="titulo"></header>
<div id="carousel"></div>

<script>

const EPG_URL = "dados_epg.xml";

/* ===== LISTA DE CANAIS ===== */
const canais = [
{num:"01.1", nome:"JOVEM PAN", id:"JovemPan.br", logo:"https://upload.wikimedia.org/wikipedia/commons/4/41/Logotipo_da_TV_Jovem_Pan_News.png"},
{num:"01.3", nome:"H&H HD", id:"Discovery.HH.br", logo:"https://upload.wikimedia.org/wikipedia/commons/9/90/Discovery_H%26H_Logo_2022.webp"},
{num:"01.4", nome:"TLC HD", id:"TLC.br", logo:"https://upload.wikimedia.org/wikipedia/commons/7/74/TLC_Logo.svg"},
{num:"01.5", nome:"ARTE 1", id:"Arte1.br", logo:"https://upload.wikimedia.org/wikipedia/commons/3/31/Arte_1_logo.svg"},
{num:"01.6", nome:"BAND NEWS", id:"BandNews.br", logo:"https://upload.wikimedia.org/wikipedia/commons/c/ce/BandNewsTV2024.svg"},
{num:"03.2", nome:"CNN BRASIL", id:"CNNBrasil.br", logo:"https://upload.wikimedia.org/wikipedia/commons/8/8b/CNN_Brasil_%28red_background%29.svg"}
];

/* ===== RELÓGIO + CLIMA ===== */
let climaTexto = "Carregando...";

function atualizarRelogio(){
  const agora = new Date();

  const horaBR = agora.toLocaleTimeString("pt-BR", {
    timeZone: "America/Sao_Paulo",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  });

  document.getElementById("titulo").innerText =
    horaBR + "  |  " + climaTexto;
}

function atualizarClima(){
  fetch("https://wttr.in/Campinas?format=1")
  .then(r => r.text())
  .then(txt => {

    let partes = txt.split(":");

    if(partes.length > 1){
      climaTexto = partes[1]
        .replace("+","")
        .replace("°C","°")
        .trim();
    } else {
      climaTexto = txt;
    }

  })
  .catch(()=> climaTexto = "Clima indisponível");
}

setInterval(atualizarRelogio,1000);
setInterval(atualizarClima,600000);

atualizarRelogio();
atualizarClima();

/* ===== FUNÇÕES EPG ===== */

function parseDate(t){
  if(!t) return 0;

  const utc = Date.UTC(
    t.substring(0,4),
    t.substring(4,6)-1,
    t.substring(6,8),
    t.substring(8,10),
    t.substring(10,12)
  );

  return utc - (3 * 60 * 60 * 1000);
}

function calc(start,stop){
  const now = Date.now();
  const s = parseDate(start);
  const e = parseDate(stop);
  if(!s || !e) return 0;
  return Math.max(0, Math.min(100, ((now-s)/(e-s))*100));
}

function hora(t){
  if(!t) return "--:--";
  const d = new Date(parseDate(t));
  return d.getHours().toString().padStart(2,"0") + ":" +
         d.getMinutes().toString().padStart(2,"0");
}

/* ===== CARREGAR EPG ===== */

function carregarEPG(xml){

const progs = [...xml.querySelectorAll("programme")];
const box = document.getElementById("carousel");

box.innerHTML = "";

canais.forEach(c=>{

let now = Date.now();

let atual = progs.find(p =>
p.getAttribute("channel")==c.id &&
parseDate(p.getAttribute("start")) <= now &&
parseDate(p.getAttribute("stop")) >= now
);

let prox = progs.find(p =>
p.getAttribute("channel")==c.id &&
parseDate(p.getAttribute("start")) > now
);

let titulo = atual?.querySelector("title")?.textContent || "Sem programação";
let inicio = hora(atual?.getAttribute("start"));
let fim = hora(atual?.getAttribute("stop"));

let proxTitulo = prox?.querySelector("title")?.textContent || "Sem info";
let proxHora = hora(prox?.getAttribute("start"));

let prog = atual ? calc(atual.getAttribute("start"),atual.getAttribute("stop")) : 0;

box.innerHTML += `
<div class="channel">

<img class="logo" src="${c.logo}" onerror="this.style.display='none'">

<div class="title">${c.num} - ${c.nome}</div>

<div class="program">
<b>${inicio} - ${fim}</b><br>
${titulo}
</div>

<div class="progress">
<div class="bar" style="width:${prog}%"></div>
</div>

<div class="next">
➡ ${proxHora} - ${proxTitulo}
</div>

</div>
`;

});
}

/* ===== ATUALIZAÇÃO AUTOMÁTICA ===== */

function atualizar(){
fetch(EPG_URL)
.then(r=>r.text())
.then(str=>new DOMParser().parseFromString(str,"text/xml"))
.then(xml=>carregarEPG(xml))
.catch(err=>console.log("Erro EPG", err));
}

atualizar();
setInterval(atualizar, 60000);

/* ===== CARROSSEL ===== */

let index = 0;

setInterval(()=>{
  const box = document.getElementById("carousel");
  index++;
  if(index >= canais.length) index = 0;
  box.style.transform = `translateX(-${index * 320}px)`;
},4000);

</script>

</body>
</html>
