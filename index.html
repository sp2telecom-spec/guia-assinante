// ===== IMPORTANTE: ARQUIVO LOCAL
const EPG_URL = "epg.xml";

let epg = [];
let pos = 0;

// ===== DATA
function parseEPGDate(str){
  return new Date(
    str.substr(0,4),
    str.substr(4,2)-1,
    str.substr(6,2),
    str.substr(8,2),
    str.substr(10,2)
  );
}

// ===== CARREGAR LOCAL
async function carregarEPG(){
  try{
    const res = await fetch(EPG_URL);
    const xml = await res.text();

    const doc = new DOMParser().parseFromString(xml,"text/xml");

    epg = [...doc.querySelectorAll("programme")].map(p=>({
      channel:p.getAttribute("channel"),
      start:parseEPGDate(p.getAttribute("start")),
      stop:parseEPGDate(p.getAttribute("stop"))
    }));

    atualizar();

  }catch(e){
    console.log("Erro EPG local:", e);
    atualizar();
  }
}

// ===== AGORA / PROXIMO
function getNowNext(id){
  const agora = new Date();
  const lista = epg.filter(p=>p.channel===id);

  let atual=null, prox=null;

  for(let i=0;i<lista.length;i++){
    if(agora>=lista[i].start && agora<lista[i].stop){
      atual = lista[i];
      prox = lista[i+1] || null;
      break;
    }
  }

  return {atual, prox};
}

// ===== RENDER
function atualizar(){

  const div = document.getElementById("canais");
  div.innerHTML="";

  canais.forEach(c=>{

    const {atual, prox} = getNowNext(c.id);

    let hora="--:--", progresso=0, proxHora="--:--";

    if(atual){
      hora = atual.start.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});

      const total = atual.stop - atual.start;
      const passou = new Date() - atual.start;

      progresso = Math.min(100,(passou/total)*100);
    }

    if(prox){
      proxHora = prox.start.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
    }

    div.innerHTML += `
      <div class="card">
        <img class="logo" src="${c.logo}">
        <div class="numero">${c.num}</div>
        <div class="nome">${c.nome}</div>

        <div class="hora">${hora}</div>

        <div class="progresso">
          <div class="barra" style="width:${progresso}%"></div>
        </div>

        <div class="proximo">→ ${proxHora}</div>
      </div>
    `;
  });
}

// ===== CARROSSEL
function mover(){
  const container = document.getElementById("canais");
  pos++;

  const largura = 240;
  container.style.transform = `translateX(-${pos * largura}px)`;

  if(pos >= canais.length){
    setTimeout(()=>{
      container.style.transition="none";
      container.style.transform="translateX(0)";
      pos=0;

      setTimeout(()=>{
        container.style.transition="transform 1s linear";
      },50);

    },1000);
  }
}

// LOOP
setInterval(mover, 4000);
setInterval(atualizar, 30000);

// start
carregarEPG();
