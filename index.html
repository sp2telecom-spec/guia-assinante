<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>EPG PRO</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:#fff;
}

header {
  background:#111b2e;
  padding:12px;
  display:flex;
  justify-content:space-between;
  font-size:18px;
}

#grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:repeat(3,1fr);
  gap:12px;
  padding:12px;
  height:calc(100vh - 60px);
}

.card {
  background:linear-gradient(145deg,#162235,#0f172a);
  padding:12px;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  box-shadow:0 0 15px rgba(0,0,0,0.5);
  transition:0.3s;
}

.card:hover {
  transform:scale(1.02);
}

.channel {
  font-size:18px;
  font-weight:bold;
  color:#00d4ff;
}

.now {
  font-size:14px;
  color:#00ff99;
}

.next {
  font-size:13px;
  color:#aaa;
}

/* barra */
.progress {
  height:6px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
  margin-top:8px;
}

.bar {
  height:100%;
  background:linear-gradient(90deg,#00ff99,#00d4ff);
  width:0%;
  transition:width 0.5s;
}
</style>
</head>

<body>

<header>
<div>📺 GUIA DE PROGRAMAÇÃO</div>
<div id="clock"></div>
</header>

<div id="grid"></div>

<script>

const epgUrl = "./epg.xml";

const channels = [
  { id: "ESPN.br", name: "ESPN HD" },
  { id: "ESPN.2.br", name: "ESPN 2" },
  { id: "Band.br", name: "BAND" },
  { id: "Band.News.br", name: "BAND NEWS" },
  { id: "CNN.International.br", name: "CNN BRASIL" },
  { id: "Record.News.br", name: "RECORD NEWS" }
];

let epg = {};

// relógio
setInterval(()=>{
document.getElementById("clock").innerText =
new Date().toLocaleTimeString("pt-BR");
},1000);

// converter horário XMLTV
function parseTime(t){
if(!t) return 0;
return new Date(
t.substring(0,4)+"-"+t.substring(4,6)+"-"+t.substring(6,8)+"T"+
t.substring(8,10)+":"+t.substring(10,12)+":"+t.substring(12,14)
).getTime();
}

// carregar epg
async function load(){

const res = await fetch(epgUrl);
const xml = new DOMParser().parseFromString(await res.text(),"text/xml");

const items = xml.getElementsByTagName("programme");

epg = {};

for(let i=0;i<items.length;i++){

let ch = items[i].getAttribute("channel");
let title = items[i].getElementsByTagName("title")[0]?.textContent || "";
let start = parseTime(items[i].getAttribute("start"));
let stop = parseTime(items[i].getAttribute("stop"));

if(!epg[ch]) epg[ch] = [];

epg[ch].push({title,start,stop});
}

render();
}

// pegar agora + progresso
function getNow(id){

let list = epg[id];
if(!list) return null;

let nowTime = Date.now();

for(let p of list){
if(nowTime >= p.start && nowTime <= p.stop){
let progress = ((nowTime - p.start) / (p.stop - p.start)) * 100;
return {title:p.title, progress};
}
}

return null;
}

// próximo
function getNext(id){

let list = epg[id];
if(!list) return "";

let nowTime = Date.now();

for(let p of list){
if(p.start > nowTime){
return p.title;
}
}

return "";
}

// render
function render(){

const grid = document.getElementById("grid");
grid.innerHTML = "";

channels.forEach(c=>{

let now = getNow(c.id);
let next = getNext(c.id);

const div = document.createElement("div");
div.className="card";

div.innerHTML=`
<div>
  <div class="channel">${c.name}</div>
  <div class="now">AGORA: ${now?.title || "Sem info"}</div>
  <div class="progress">
    <div class="bar" style="width:${now?.progress || 0}%"></div>
  </div>
</div>

<div class="next">PRÓXIMO: ${next || "Sem info"}</div>
`;

grid.appendChild(div);

});

}

// init
load();
setInterval(load,300000);

</script>

</body>
</html>
