<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>EPG TV</title>

<style>
body {
  margin:0;
  background:#0b0b0f;
  font-family:Arial;
  color:#fff;
}

header {
  padding:20px;
  font-size:24px;
}

#carousel {
  display:flex;
  gap:15px;
  overflow-x:auto;
  padding:20px;
}

.channel {
  min-width:260px;
  background:#14141c;
  border-radius:12px;
  padding:15px;
  transition:.3s;
}

.channel:hover {
  transform:scale(1.08);
}

.logo {
  width:100%;
  height:80px;
  object-fit:contain;
}

.title {
  font-weight:bold;
  margin-top:10px;
}

.program {
  font-size:14px;
  opacity:.8;
}

.progress {
  height:5px;
  background:#333;
  margin-top:10px;
  border-radius:5px;
}

.bar {
  height:100%;
  background:#e50914;
}
</style>
</head>

<body>

<header>📺 Guia TV</header>
<div id="carousel"></div>

<script>

const EPG_URL = "dados_epg.xml";

/* CANAIS COM LOGO DIRETO */
const canais = [

{num:"01.1", nome:"JOVEM PAN2", id:"JovemPan.br", logo:"https://upload.wikimedia.org/wikipedia/commons/4/41/Logotipo_da_TV_Jovem_Pan_News.png"},
{num:"01.3", nome:"H&H HD", id:"Discovery.Home.Health.br", logo:"https://upload.wikimedia.org/wikipedia/commons/9/90/Discovery_H%26H_Logo_2022.webp"},
{num:"01.4", nome:"TLC HD", id:"TLC.br", logo:"https://upload.wikimedia.org/wikipedia/commons/7/74/TLC_Logo.svg"},
{num:"01.5", nome:"ARTE 1", id:"Arte.1.br", logo:"https://upload.wikimedia.org/wikipedia/commons/3/31/Arte_1_logo.svg"},
{num:"01.6", nome:"BAND NEWS", id:"Band.News.br", logo:"https://upload.wikimedia.org/wikipedia/commons/c/ce/BandNewsTV2024.svg"},

{num:"02.1", nome:"TV CAMARA", id:"TVCamara.br", logo:"https://upload.wikimedia.org/wikipedia/commons/8/8e/Marca_TV_C%C3%A2mara_-_2018.png"},
{num:"02.2", nome:"TV SENADO", id:"TVSenado.br", logo:"https://upload.wikimedia.org/wikipedia/commons/3/3f/TV_Senado_logo_%281996%E2%80%932016%29.png"},
{num:"02.4", nome:"TV ESCOLA", id:"TV.Escola.br", logo:"https://upload.wikimedia.org/wikipedia/commons/b/b5/TV_Escola.png"},
{num:"02.5", nome:"CANAL SAUDE", id:"Canal.Saude.br", logo:"https://acervo.canalsaude.fiocruz.br/tools/images/logo-topMaior.jpg"},
{num:"02.6", nome:"BAND", id:"Band.br", logo:"https://upload.wikimedia.org/wikipedia/commons/2/2b/Rede_Bandeirantes_logo_2018.svg"},

{num:"03.1", nome:"RECORD NEWS", id:"Record.News.br", logo:"https://upload.wikimedia.org/wikipedia/commons/4/46/Record_News_logo_2023.svg"},
{num:"03.2", nome:"CNN BRASIL", id:"CNN.br", logo:"https://upload.wikimedia.org/wikipedia/commons/8/8b/CNN_Brasil_%28red_background%29.svg"},
{num:"03.3", nome:"CNN INTERNACIONAL", id:"CNN.International.br", logo:"https://upload.wikimedia.org/wikipedia/commons/9/9d/CNN_Logo_%282014%29.svg"},

{num:"08.1", nome:"ESPN HD", id:"ESPN.br", logo:"https://upload.wikimedia.org/wikipedia/commons/2/2f/ESPN_wordmark.svg"},
{num:"08.2", nome:"ESPN 2", id:"ESPN.2.br", logo:"https://upload.wikimedia.org/wikipedia/commons/b/bf/ESPN2_logo.svg"},

{num:"09.1", nome:"CARTOON NETWORK", id:"Cartoon.Network.br", logo:"https://upload.wikimedia.org/wikipedia/commons/8/80/Cartoon_Network_2010_logo.svg"},
{num:"09.5", nome:"DISCOVERY KIDS", id:"Discovery.Kids.br", logo:"https://upload.wikimedia.org/wikipedia/commons/7/7f/Discovery_Kids_2021_2D_sin_wordmark.svg"},

{num:"35.2", nome:"WARNER HD", id:"Warner.Channel.br", logo:"https://upload.wikimedia.org/wikipedia/commons/b/b0/Warner_Channel_2026.svg"},
{num:"35.3", nome:"SONY HD", id:"Sony.br", logo:"https://upload.wikimedia.org/wikipedia/commons/e/ee/Sony_Channel_LA_2023.png"},
{num:"35.5", nome:"SPACE HD", id:"Space.br", logo:"https://upload.wikimedia.org/wikipedia/commons/1/1a/SpaceLogo.svg"},

{num:"51.1", nome:"ANIMAL PLANET HD", id:"Animal.Planet.br", logo:"https://upload.wikimedia.org/wikipedia/commons/2/20/2018_Animal_Planet_logo.svg"},
{num:"51.2", nome:"HISTORY HD", id:"History.Channel.br", logo:"https://upload.wikimedia.org/wikipedia/commons/0/01/History_%282021%29.svg"},

{num:"55.1", nome:"TNT HD", id:"TNT.br", logo:"https://upload.wikimedia.org/wikipedia/commons/2/24/TNT_Logo_2016.svg"},

];

/* PROGRESSO */
function calc(start,stop){
  const now = new Date().getTime();
  const s = new Date(start.substring(0,4),start.substring(4,6)-1,start.substring(6,8),start.substring(8,10),start.substring(10,12)).getTime();
  const e = new Date(stop.substring(0,4),stop.substring(4,6)-1,start.substring(6,8),stop.substring(8,10),stop.substring(10,12)).getTime();
  return ((now-s)/(e-s))*100;
}

/* LOAD */
fetch(EPG_URL)
.then(r=>r.text())
.then(str=>new DOMParser().parseFromString(str,"text/xml"))
.then(xml=>{

const progs = xml.querySelectorAll("programme");
const box = document.getElementById("carousel");

canais.forEach(c=>{

let now = new Date().toISOString().replace(/[-:TZ]/g,"").slice(0,12);

let p = [...progs].find(x =>
x.getAttribute("channel")==c.id &&
x.getAttribute("start")<=now &&
x.getAttribute("stop")>=now
);

let title = p?.querySelector("title")?.textContent || "Sem programação";

let prog = p ? calc(p.getAttribute("start"),p.getAttribute("stop")) : 0;

box.innerHTML += `
<div class="channel">
<img class="logo" src="${c.logo}">
<div class="title">${c.num} - ${c.nome}</div>
<div class="program">${title}</div>
<div class="progress"><div class="bar" style="width:${prog}%"></div></div>
</div>
`;

});

});

/* AUTO SCROLL */
setInterval(()=>{
document.getElementById("carousel").scrollBy({left:300,behavior:"smooth"});
},4000);

</script>

</body>
</html>
