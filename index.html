<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>EPG TV</title>

<style>
body{
  margin:0;
  background:#0b0b0f;
  font-family:Arial;
  color:#fff;
  overflow:hidden;
}

header{
  padding:20px;
  font-size:22px;
}

#carousel{
  display:flex;
  gap:15px;
  padding:20px;
  transition:transform .5s ease;
}

.channel{
  min-width:260px;
  background:#14141c;
  border-radius:12px;
  padding:15px;
}

.logo{
  width:100%;
  height:80px;
  object-fit:contain;
}

.title{font-weight:bold;margin-top:10px;}
.program{font-size:14px;opacity:.85;}
.next{font-size:13px;opacity:.6;margin-top:8px;}

.progress{
  height:5px;
  background:#333;
  margin-top:10px;
}
.bar{
  height:100%;
  background:#e50914;
}
</style>
</head>

<body>

<header>📺 Guia TV</header>
<div id="carousel"></div>

<script>
const EPG_URL = "dados_epg.xml";

/* CANAIS (teste inicial) */
const canais = [
{num:"01.1", nome:"JOVEM PAN2", id:"JovemPan.br", logo:"https://images.weserv.nl/?url=upload.wikimedia.org/wikipedia/commons/4/41/Logotipo_da_TV_Jovem_Pan_News.png"},
{num:"03.1", nome:"RECORD NEWS", id:"Record.News.br", logo:"https://images.weserv.nl/?url=upload.wikimedia.org/wikipedia/commons/4/46/Record_News_logo_2023.svg"},
{num:"08.1", nome:"ESPN HD", id:"ESPN.br", logo:"https://images.weserv.nl/?url=upload.wikimedia.org/wikipedia/commons/2/2f/ESPN_wordmark.svg"},
{num:"09.1", nome:"CARTOON NETWORK", id:"Cartoon.Network.br", logo:"https://images.weserv.nl/?url=upload.wikimedia.org/wikipedia/commons/8/80/Cartoon_Network_2010_logo.svg"},
{num:"55.1", nome:"TNT HD", id:"TNT.br", logo:"https://images.weserv.nl/?url=upload.wikimedia.org/wikipedia/commons/2/24/TNT_Logo_2016.svg"}
];

/* FUNÇÕES SEGURAS */
function parseDate(t){
  return new Date(
    t.substring(0,4),
    t.substring(4,6)-1,
    t.substring(6,8),
    t.substring(8,10),
    t.substring(10,12)
  ).getTime();
}

function calc(start,stop){
  const now = Date.now();
  const s = parseDate(start);
  const e = parseDate(stop);
  if(!s || !e) return 0;
  return Math.max(0, Math.min(100, ((now-s)/(e-s))*100));
}

function hora(t){
  return t ? t.substring(8,10)+":"+t.substring(10,12) : "--:--";
}

/* LOAD */
fetch(EPG_URL)
.then(r=>r.text())
.then(str=>new DOMParser().parseFromString(str,"text/xml"))
.then(xml=>{

const progs = [...xml.querySelectorAll("programme")];
const box = document.getElementById("carousel");

canais.forEach(c=>{

try{

let now = new Date().toISOString().replace(/[-:TZ]/g,"").slice(0,12);

/* ATUAL */
let atual = progs.find(p =>
p.getAttribute("channel")==c.id &&
p.getAttribute("start")<=now &&
p.getAttribute("stop")>=now
);

/* PRÓXIMO */
let prox = progs.find(p =>
p.getAttribute("channel")==c.id &&
p.getAttribute("start") > now
);

/* DADOS */
let titulo = atual?.querySelector("title")?.textContent || "Sem programação";
let inicio = hora(atual?.getAttribute("start"));
let fim = hora(atual?.getAttribute("stop"));

let proxTitulo = prox?.querySelector("title")?.textContent || "Sem info";
let proxHora = hora(prox?.getAttribute("start"));

let prog = atual ? calc(atual.getAttribute("start"),atual.getAttribute("stop")) : 0;

/* HTML */
box.innerHTML += `
<div class="channel">
<img class="logo" src="${c.logo}">
<div class="title">${c.num} - ${c.nome}</div>

<div class="program">
<b>${inicio} - ${fim}</b><br>
${titulo}
</div>

<div class="progress">
<div class="bar" style="width:${prog}%"></div>
</div>

<div class="next">
➡ ${proxHora} - ${proxTitulo}
</div>

</div>
`;

}catch(e){
console.log("Erro canal:",c.nome,e);
}

});

/* LOOP */
let index = 0;
const total = canais.length;

setInterval(()=>{
  index++;
  if(index >= total) index = 0;
  box.style.transform = `translateX(-${index * 275}px)`;
},4000);

})
.catch(err=>{
  document.body.innerHTML = "<h2 style='padding:20px'>Erro ao carregar EPG</h2>";
  console.error(err);
});
</script>

</body>
</html>
