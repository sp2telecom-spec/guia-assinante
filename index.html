<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>EPG IPTV - Carrossel</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1220;
    color: #fff;
}

header {
    background: #111b2e;
    padding: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#clock {
    color: #00ff99;
    font-weight: bold;
}

.container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(3, 1fr);
    gap: 10px;
    padding: 10px;
    height: calc(100vh - 60px);
}

.card {
    background: #162235;
    border-radius: 8px;
    padding: 10px;
    overflow: hidden;
}

.channel {
    color: #00d4ff;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 5px;
}

.now {
    color: #00ff99;
    font-size: 13px;
    margin-top: 5px;
}

.next {
    color: #aaa;
    font-size: 12px;
}

.fade {
    animation: fade 0.5s ease-in-out;
}

@keyframes fade {
    from {opacity: 0.2;}
    to {opacity: 1;}
}
</style>
</head>

<body>

<header>
    <div>📺 Guia de Programação IPTV</div>
    <div id="clock"></div>
</header>

<div class="container" id="grid"></div>

<script>

// ===============================
// EPG GRATUITO (IPTV-ORG)
// ===============================
const epgUrl = "https://iptv-org.github.io/epg/guides/br.xml";

// canais que você quer exibir
const channels = [
"JOVEM PAN2","H&H HD","TLC HD","ARTE 1","BAND NEWS",
"TV CAMARA","TV SENADO","TV ESCOLA","CANAL SAUDE","BAND",
"RECORD NEWS","CNN BRASIL","CNN INTERNACIONAL","CNN ESPANHOL",
"BAND SPORTS HD","FISH TV","BAND MAIS HD","EPTV SÃO CARLOS",
"RBI","ESPN HD","ESPN 2","ESPN 3","ESPN 4","ESPN 5","ESPN 6 (ESPN EXTRA HD)",
"CARTOON NETWORK","CARTOONITO","TOONCAST","RATIMBUM","DISCOVERY KIDS","REDE TV HD",
"RECORD INTERIOR","TV CULTURA HD","UNIVESP","REDE ALESP","TV CAMARA SP",
"REDE VIDA HD","REDE VIDA +","REDE VIDA EDUCAÇÃO",
"DISCOVERY ID","DISCOVERY","DISCOVERY TURBO","DISCOVERY SCIENCE HD",
"DISCOVERY THEATER HD","DISCOVERY WORLD HD",
"WOOHOO","WARNER HD","SONY HD","SONY MOVIES","SPACE HD","CINE BRASIL",
"TV APARECIDA","VTV SBT HD","MAIS FAMILIA HD","BOAS NOVAS",
"CANAL DO BOI HD","AGRO CANAL HD","CANAL RURAL HD","TERRA VIVA","TCM",
"ANIMAL PLANET HD","HISTORY HD","HISTORY 2 HD","HGTV","AXN HD","A&E HD",
"TNT HD","TNT SERIES","LIFETIME HD","FASHION TV","MUSIC BOX HD","TNT NOVELA",
"TRAVEL BOX","CHEF TV","CINEMAX","SABOR E ARTE","TOP FILM","ADULT SWIM",
"TV LEME","AMC","PRIME BOX","CAZE TV"
];

let epgData = {};
let page = 0;
const perPage = 6;

// relógio
function updateClock(){
    document.getElementById("clock").innerText =
    new Date().toLocaleTimeString("pt-BR");
}
setInterval(updateClock,1000);
updateClock();

// ===============================
// CARREGA EPG XMLTV
// ===============================
async function loadEPG(){
    try {
        const res = await fetch(epgUrl);
        const text = await res.text();

        const xml = new DOMParser().parseFromString(text,"text/xml");
        const programs = xml.getElementsByTagName("programme");

        epgData = {};

        for(let i=0;i<programs.length;i++){
            const ch = programs[i].getAttribute("channel");
            const title = programs[i].getElementsByTagName("title")[0]?.textContent || "";

            if(!epgData[ch]) epgData[ch] = [];

            epgData[ch].push(title);
        }

        render();
    } catch(e){
        console.log("Erro EPG:",e);
    }
}

// ===============================
// RENDER 6 CANAIS POR TELA
// ===============================
function render(){

    const grid = document.getElementById("grid");
    grid.classList.add("fade");

    setTimeout(()=>grid.classList.remove("fade"),500);

    grid.innerHTML = "";

    const start = page * perPage;
    const slice = channels.slice(start,start+perPage);

    slice.forEach(name=>{

        const prog = epgData[name] || [];

        const now = prog[0] || "Sem informação";
        const next = prog[1] || "";

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <div class="channel">${name}</div>
            <div class="now">AGORA: ${now}</div>
            <div class="next">PRÓXIMO: ${next}</div>
        `;

        grid.appendChild(card);
    });

    page++;
    if(page * perPage >= channels.length) page = 0;
}

// carrossel automático 10s
setInterval(render,10000);

// init
loadEPG();
setInterval(loadEPG,300000);

</script>

</body>
</html>
