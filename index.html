<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>GUIA TV</title>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
html, body{
  width:1920px;
  height:1080px;
  margin:0;
  padding:0;
  overflow:hidden;
  background:transparent;
  font-family:Arial, sans-serif;
  color:#fff;
}

#carousel{
  display:flex;
  flex-wrap:wrap;
  gap:18px;
  position:absolute;
  top:40px;
  left:40px;
  width:1840px;
}

.channel{
  width:300px;
  height:180px;
  background: rgba(20, 20, 20, 0.6);
  backdrop-filter: blur(14px);
  border-radius:16px;
  padding:10px;
  border:1px solid rgba(255,255,255,0.12);
}

.logo{
  width:100%;
  height:45px;
  object-fit:contain;
  margin-bottom:8px;
}

.title{
  font-size:17px;
  font-weight:600;
  margin-bottom:6px;
}

.program{
  font-size:14px;
  line-height:1.3;
}

.next{
  font-size:12px;
  opacity:.7;
  margin-top:8px;
}

.progress{
  height:4px;
  background:rgba(255,255,255,0.15);
  margin-top:10px;
  border-radius:10px;
  overflow:hidden;
}

.bar{
  height:100%;
  background:#00c853;
}
</style>
</head>

<body>

<div id="carousel"></div>

<script>

const EPG_URL = "epg.xml";

/* ===== CANAIS (SEU PADRÃO MANTIDO) ===== */
const canais = [
{num:"01.1", nome:"JOVEM PAN", id:["Jovem.Pan.News.br","JovemPan.br"], logo:"https://upload.wikimedia.org/wikipedia/commons/4/41/Logotipo_da_TV_Jovem_Pan_News.png"},
{num:"01.3", nome:"H&H HD", id:["Sao.Paulo/SP..Discovery.Home.and.Health.br"], logo:"https://upload.wikimedia.org/wikipedia/commons/9/90/Discovery_H%26H_Logo_2022.webp"},
{num:"01.6", nome:"BAND NEWS", id:["Sao.Paulo/SP..Band.News.br"], logo:"https://upload.wikimedia.org/wikipedia/commons/c/ce/BandNewsTV2024.svg"},
{num:"03.2", nome:"CNN BRASIL", id:["Sao.Paulo/SP..CNN.Brasil.br"], logo:"https://upload.wikimedia.org/wikipedia/commons/8/8b/CNN_Brasil_%28red_background%29.svg"},
{num:"08.1", nome:"ESPN", id:["ESPN.br"], logo:"https://upload.wikimedia.org/wikipedia/commons/2/2f/ESPN_wordmark.svg"},
{num:"09.1", nome:"CARTOON NETWORK", id:["Sao.Paulo/SP..Cartoon.Network.br"], logo:"https://upload.wikimedia.org/wikipedia/commons/8/80/Cartoon_Network_2010_logo.svg"},
{num:"13.1", nome:"RECORD", id:["Sao.Paulo/SP..Record.br"], logo:"https://upload.wikimedia.org/wikipedia/pt/0/0e/Logotipo_da_Record_%28rede_de_televis%C3%A3o%29.png"},
{num:"39.1", nome:"SBT", id:["Sao.Paulo/SP..SBT.br"], logo:"https://upload.wikimedia.org/wikipedia/pt/4/41/Logotipo_do_SBT.svg"}
];

/* ===== FUNÇÕES ===== */

function parseDate(t){
  if(!t) return 0;
  const utc = Date.UTC(
    t.substring(0,4),
    t.substring(4,6)-1,
    t.substring(6,8),
    t.substring(8,10),
    t.substring(10,12)
  );
  return utc - (3 * 60 * 60 * 1000);
}

function calc(start,stop){
  const now = Date.now();
  const s = parseDate(start);
  const e = parseDate(stop);
  if(!s || !e) return 0;
  return Math.max(0, Math.min(100, ((now-s)/(e-s))*100));
}

function hora(t){
  if(!t) return "--:--";
  const d = new Date(parseDate(t));
  return d.getHours().toString().padStart(2,"0") + ":" +
         d.getMinutes().toString().padStart(2,"0");
}

/* ===== RENDER ===== */

function carregarEPG(xml){

const progs = [...xml.querySelectorAll("programme")];
const box = document.getElementById("carousel");

box.innerHTML = "";

canais.forEach(c=>{

let now = Date.now();
const ids = Array.isArray(c.id) ? c.id : [c.id];

let atual = progs.find(p =>
ids.includes(p.getAttribute("channel")) &&
parseDate(p.getAttribute("start")) <= now &&
parseDate(p.getAttribute("stop")) >= now
);

let prox = progs.find(p =>
ids.includes(p.getAttribute("channel")) &&
parseDate(p.getAttribute("start")) > now
);

let titulo = atual?.querySelector("title")?.textContent || "Sem programação";
let inicio = hora(atual?.getAttribute("start"));
let fim = hora(atual?.getAttribute("stop"));

let proxTitulo = prox?.querySelector("title")?.textContent || "Sem info";
let proxHora = hora(prox?.getAttribute("start"));

let prog = atual ? calc(atual.getAttribute("start"),atual.getAttribute("stop")) : 0;

box.innerHTML += `
<div class="channel">
<img class="logo" src="${c.logo}" onerror="this.style.display='none'">

<div class="title">${c.num} - ${c.nome}</div>

<div class="program">
<b>${inicio} - ${fim}</b><br>
${titulo}
</div>

<div class="progress">
<div class="bar" style="width:${prog}%"></div>
</div>

<div class="next">
➡ ${proxHora} - ${proxTitulo}
</div>

</div>
`;

});

}

/* ===== FETCH SEM CACHE + PROTEÇÃO ===== */

function atualizar(){

const url = EPG_URL + "?nocache=" + Date.now();

fetch(url, {
  method: "GET",
  headers: {
    "Cache-Control": "no-cache"
  }
})
.then(r => {
  if(!r.ok) throw new Error("Erro ao carregar XML");
  return r.text();
})
.then(str => {

  if(!str || str.length < 50){
    throw new Error("XML vazio");
  }

  const xml = new DOMParser().parseFromString(str,"text/xml");

  if(xml.querySelector("parsererror")){
    throw new Error("Erro ao parsear XML");
  }

  carregarEPG(xml);

})
.catch(err => {
  console.log("❌ EPG erro:", err.message);

  document.getElementById("carousel").innerHTML =
    "<div style='font-size:22px'>❌ ERRO EPG</div>";
});

}

/* ===== LOOP ===== */

setInterval(atualizar, 60000);
atualizar();

</script>

</body>
</html>
