<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canal do Assinante - EPG Real e Automático</title>
<style>
    :root {
        --bg-primary: #0b0f1a;
        --bg-card: #151f32;
        --accent: #3b82f6;
        --success: #10b981;
        --text-main: #ffffff;
        --text-muted: #9ca3af;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-primary);
        font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        color: var(--text-main);
        overflow: hidden; 
    }

    .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 25px;
        height: 100vh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #1e293b;
        padding-bottom: 15px;
        margin-bottom: 25px;
    }

    h1 {
        font-size: 28px;
        margin: 0;
        letter-spacing: 0.5px;
    }

    .status-panel {
        display: flex;
        gap: 15px;
        align-items: center;
    }

    .counter-badge {
        font-size: 14px;
        padding: 6px 14px;
        border-radius: 20px;
        background: #1e293b;
        color: var(--accent);
        font-weight: bold;
    }

    .time-badge {
        font-size: 22px;
        font-weight: bold;
        color: var(--success);
        letter-spacing: 1px;
    }

    .epg-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 25px;
        flex-grow: 1;
        align-content: start;
    }

    .card {
        background: var(--bg-card);
        border-radius: 16px;
        padding: 25px;
        border: 1px solid #1e293b;
        border-left: 6px solid var(--accent);
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 185px;
        animation: transicaoSlide 0.5s ease-in-out;
    }

    .channel-name {
        font-size: 22px;
        font-weight: bold;
        color: #f3f4f6;
    }

    .program-current {
        font-size: 19px;
        font-weight: bold;
        color: var(--success);
        margin-bottom: 6px;
    }

    .program-time {
        font-size: 14px;
        color: var(--text-muted);
    }

    .progress-container {
        background: #1e293b;
        height: 6px;
        border-radius: 3px;
        margin: 14px 0;
        overflow: hidden;
    }

    .progress-bar {
        background: var(--success);
        height: 100%;
        width: 0%;
        transition: width 0.5s ease;
    }

    .program-next {
        font-size: 15px;
        color: var(--text-muted);
        border-top: 1px solid #1e293b;
        padding-top: 12px;
    }

    .next-label {
        font-size: 11px;
        text-transform: uppercase;
        color: var(--accent);
        display: block;
        margin-bottom: 2px;
        font-weight: bold;
    }

    .loading-msg {
        grid-column: 1 / -1;
        text-align: center;
        padding: 60px;
        font-size: 22px;
        color: var(--text-muted);
    }

    @keyframes transicaoSlide {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body>

<div class="container">
    <header>
        <h1>📺 CANAL DO ASSINANTE</h1>
        <div class="status-panel">
            <div class="counter-badge" id="page-info">Conectando...</div>
            <div class="time-badge" id="live-clock">00:00:00</div>
        </div>
    </header>

    <main class="epg-grid" id="epg-container">
        <div class="loading-msg">Sincronizando canais ao vivo...</div>

function formatarHora(timestamp) {
    if (!timestamp) return "--:--";

                let tituloProx = prox ? prox.title : "Fim da programação registrada";
