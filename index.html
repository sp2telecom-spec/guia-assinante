<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Guia de Programação IPTV</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0b1220;
    color: #fff;
}

header {
    background: #111b2e;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

h1 {
    font-size: 18px;
    margin: 0;
}

#clock {
    font-size: 14px;
    color: #00ff99;
}

#search {
    padding: 8px;
    width: 200px;
    border-radius: 5px;
    border: none;
}

.container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 10px;
}

.channel {
    background: #162235;
    padding: 10px;
    border-radius: 8px;
}

.channel-title {
    font-weight: bold;
    margin-bottom: 8px;
    color: #00d4ff;
}

.program {
    font-size: 13px;
    padding: 3px 0;
    border-bottom: 1px solid #23324d;
}

.now {
    color: #00ff99;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>📺 Guia de Programação IPTV</h1>
    <input id="search" placeholder="Buscar canal..." onkeyup="filterChannels()">
    <div id="clock"></div>
</header>

<div class="container" id="epg"></div>

<script>

const epgUrl = "EPG.xml"; // <<< COLOQUE SUA URL DO GITHUB RAW AQUI

let epgData = [];

function updateClock() {
    const now = new Date();
    document.getElementById("clock").innerText =
        now.toLocaleTimeString("pt-BR");
}
setInterval(updateClock, 1000);
updateClock();

// carregar EPG XML
async function loadEPG() {
    const res = await fetch(epgUrl);
    const text = await res.text();

    const parser = new DOMParser();
    const xml = parser.parseFromString(text, "text/xml");

    const channels = xml.getElementsByTagName("channel");
    const programs = xml.getElementsByTagName("programme");

    let data = {};

    // canais
    for (let i = 0; i < channels.length; i++) {
        let id = channels[i].getAttribute("id");
        let name = channels[i].getElementsByTagName("display-name")[0].textContent;
        data[id] = { name, programs: [] };
    }

    // programas
    for (let i = 0; i < programs.length; i++) {
        let ch = programs[i].getAttribute("channel");
        let title = programs[i].getElementsByTagName("title")[0].textContent;
        let start = programs[i].getAttribute("start");

        if (data[ch]) {
            data[ch].programs.push({ title, start });
        }
    }

    epgData = Object.values(data);
    render();
}

function render(filter = "") {
    const container = document.getElementById("epg");
    container.innerHTML = "";

    const now = new Date();

    epgData.forEach(ch => {
        if (filter && !ch.name.toLowerCase().includes(filter.toLowerCase())) return;

        const div = document.createElement("div");
        div.className = "channel";

        let html = `<div class="channel-title">${ch.name}</div>`;

        ch.programs.slice(0, 3).forEach(p => {
            let start = parseTime(p.start);
            let isNow = Math.abs(now - start) < 1000 * 60 * 60;

            html += `<div class="program ${isNow ? 'now' : ''}">
                        ${formatTime(start)} - ${p.title}
                     </div>`;
        });

        div.innerHTML = html;
        container.appendChild(div);
    });
}

function parseTime(str) {
    // formato XMLTV: 20260603120000 +0000
    const y = str.substr(0,4);
    const m = str.substr(4,2);
    const d = str.substr(6,2);
    const h = str.substr(8,2);
    const min = str.substr(10,2);

    return new Date(`${y}-${m}-${d}T${h}:${min}:00`);
}

function formatTime(date) {
    return date.toLocaleTimeString("pt-BR", {
        hour: "2-digit",
        minute: "2-digit"
    });
}

function filterChannels() {
    render(document.getElementById("search").value);
}

loadEPG();
setInterval(loadEPG, 300000); // atualiza a cada 5 min

</script>

</body>
</html>
