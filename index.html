<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>EPG TV</title>

<style>
html, body{
  width:1920px;
  height:1080px;
  margin:0;
  padding:0;
  overflow:hidden;
  background:transparent;
  font-family:Arial, sans-serif;
  color:#fff;
}

/* HEADER FIXO (OBS FRIENDLY) */
header{
  position:absolute;
  top:20px;
  left:40px;
  font-size:34px;
  font-weight:bold;
}

/* CARROSSEL */
#carousel{
  display:flex;
  gap:20px;
  position:absolute;
  top:120px;
  left:40px;
  transition:transform .6s ease;
}

.channel{
  min-width:300px;
  height:280px;
  background:rgba(20,20,28,0.85);
  border-radius:14px;
  padding:15px;
}

.logo{
  width:100%;
  height:50px;
  object-fit:contain;
}

.title{
  font-size:18px;
  font-weight:bold;
  margin-top:10px;
}

.program{
  font-size:15px;
  margin-top:8px;
}

.next{
  font-size:13px;
  opacity:.7;
  margin-top:10px;
}

.progress{
  height:6px;
  background:#333;
  margin-top:12px;
  border-radius:10px;
  overflow:hidden;
}

.bar{
  height:100%;
  background:#ff0000;
}
</style>
</head>

<body>

<header id="titulo">📺 Guia de Programação</header>

<div id="carousel"></div>

<script>

const EPG_URL = "dados_epg.xml";

/* CANAIS */
const canais = [
{num:"01.1", nome:"JOVEM PAN", id:"JovemPan.br", logo:"https://images.weserv.nl/?url=upload.wikimedia.org/wikipedia/commons/4/41/Logotipo_da_TV_Jovem_Pan_News.png"},
{num:"03.1", nome:"RECORD NEWS", id:"Record.News.br", logo:"https://images.weserv.nl/?url=upload.wikimedia.org/wikipedia/commons/4/46/Record_News_logo_2023.svg"},
{num:"08.1", nome:"ESPN", id:"ESPN.br", logo:"https://images.weserv.nl/?url=upload.wikimedia.org/wikipedia/commons/2/2f/ESPN_wordmark.svg"},
{num:"09.1", nome:"CARTOON", id:"Cartoon.Network.br", logo:"https://images.weserv.nl/?url=upload.wikimedia.org/wikipedia/commons/8/80/Cartoon_Network_2010_logo.svg"},
{num:"55.1", nome:"TNT", id:"TNT.br", logo:"https://images.weserv.nl/?url=upload.wikimedia.org/wikipedia/commons/2/24/TNT_Logo_2016.svg"}
];

/* ===== RELÓGIO CORRETO BRASIL ===== */
function atualizarRelogio(){
  const agora = new Date();

  const horaBR = agora.toLocaleTimeString("pt-BR", {
    timeZone: "America/Sao_Paulo",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  });

  document.getElementById("titulo").innerText =
    "📺 Guia de Programação - " + horaBR;
}

setInterval(atualizarRelogio,1000);
atualizarRelogio();

/* ===== CORREÇÃO FUSO EPG ===== */
function parseDate(t){
  if(!t) return 0;

  // UTC → Brasil (-3h)
  const utc = Date.UTC(
    t.substring(0,4),
    t.substring(4,6)-1,
    t.substring(6,8),
    t.substring(8,10),
    t.substring(10,12)
  );

  return utc - (3 * 60 * 60 * 1000); // ajuste Brasil
}

function calc(start,stop){
  const now = Date.now();
  const s = parseDate(start);
  const e = parseDate(stop);
  if(!s || !e) return 0;
  return Math.max(0, Math.min(100, ((now-s)/(e-s))*100));
}

function hora(t){
  if(!t) return "--:--";
  const d = new Date(parseDate(t));
  return d.getHours().toString().padStart(2,"0") + ":" +
         d.getMinutes().toString().padStart(2,"0");
}

/* RENDER */
function carregarEPG(xml){

const progs = [...xml.querySelectorAll("programme")];
const box = document.getElementById("carousel");

box.innerHTML = "";

canais.forEach(c=>{

let now = Date.now();

let atual = progs.find(p =>
p.getAttribute("channel")==c.id &&
parseDate(p.getAttribute("start")) <= now &&
parseDate(p.getAttribute("stop")) >= now
);

let prox = progs.find(p =>
p.getAttribute("channel")==c.id &&
parseDate(p.getAttribute("start")) > now
);

let titulo = atual?.querySelector("title")?.textContent || "Sem programação";
let inicio = hora(atual?.getAttribute("start"));
let fim = hora(atual?.getAttribute("stop"));

let proxTitulo = prox?.querySelector("title")?.textContent || "Sem info";
let proxHora = hora(prox?.getAttribute("start"));

let prog = atual ? calc(atual.getAttribute("start"),atual.getAttribute("stop")) : 0;

box.innerHTML += `
<div class="channel">
<img class="logo" src="${c.logo}" onerror="this.style.display='none'">

<div class="title">${c.num} - ${c.nome}</div>

<div class="program">
<b>${inicio} - ${fim}</b><br>
${titulo}
</div>

<div class="progress">
<div class="bar" style="width:${prog}%"></div>
</div>

<div class="next">
➡ ${proxHora} - ${proxTitulo}
</div>

</div>
`;

});
}

/* ATUALIZAÇÃO */
function atualizar(){
fetch(EPG_URL)
.then(r=>r.text())
.then(str=>new DOMParser().parseFromString(str,"text/xml"))
.then(xml=>carregarEPG(xml))
.catch(err=>console.log("Erro EPG", err));
}

atualizar();
setInterval(atualizar, 60000);

/* CARROSSEL LOOP */
let index = 0;

setInterval(()=>{
  const box = document.getElementById("carousel");
  index++;
  if(index >= canais.length) index = 0;
  box.style.transform = `translateX(-${index * 320}px)`;
},4000);

</script>

</body>
</html>
